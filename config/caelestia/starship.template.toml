# version: 1.0.0-theme
# Caelestia starship config - colors follow the caelestia scheme live.
# Rendered from ~/.config/caelestia/starship.template.toml by kitty-colors.py.



add_newline = false
continuation_prompt = "[▸▹ ](dimmed onsurface)"

format = """($nix_shell$container$fill$git_metrics\n)$cmd_duration\
$hostname\
$localip\
$shlvl\
$shell\
$env_var\
$jobs\
$sudo\
$username\
$character"""

right_format = """
$singularity\
$kubernetes\
$directory\
$vcsh\
$fossil_branch\
$git_branch\
$git_commit\
$git_state\
$git_status\
$hg_branch\
$pijul_channel\
$docker_context\
$package\
$c\
$cmake\
$cobol\
$daml\
$dart\
$deno\
$dotnet\
$elixir\
$elm\
$erlang\
$fennel\
$golang\
$guix_shell\
$haskell\
$haxe\
$helm\
$java\
$julia\
$kotlin\
$gradle\
$lua\
$nim\
$nodejs\
$ocaml\
$opa\
$perl\
$php\
$pulumi\
$purescript\
$python\
$raku\
$rlang\
$error\
$ruby\
$rust\
$scala\
$solidity\
$swift\
$terraform\
$vlang\
$vagrant\
$zig\
$buf\
$conda\
$meson\
$spack\
$memory_usage\
$aws\
$gcloud\
$openstack\
$azure\
$crystal\
$custom\
$status\
$os\
$battery\
$time"""

palette = "caelestia"

[fill]
symbol = ' '

[character]
format = "$symbol "
success_symbol = "[◎](bold italic primary)"
error_symbol = "[○](italic tertiary)"
vimcmd_symbol = "[■](italic dimmed tertiary)"
# not supported in zsh
vimcmd_replace_one_symbol = "◌"
vimcmd_replace_symbol = "□"
vimcmd_visual_symbol = "▼"

[env_var.VIMSHELL]
format = "[$env_value]($style)"
style = 'tertiary italic'

[sudo]
format = "[$symbol]($style)"
style = "bold italic tertiary"
symbol = "⋈┈"
disabled = false

[username]
style_user = "primary bold italic"
style_root = "tertiary bold italic"
format = "[⭘ $user]($style) "
disabled = false
show_always = false

[directory]
home_symbol = "⌂"
truncation_length = 2
truncation_symbol = "□ "
read_only = " ◈"
use_os_path_sep = true
style = "italic secondary"
format = '[$path]($style)[$read_only]($read_only_style)'
repo_root_style = 'bold secondary'
repo_root_format = '[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) [△](bold secondary)'

[cmd_duration]
min_time = 2000
format = "[◄ $duration ](italic onsurface)"

[jobs]
format = "[$symbol$number]($style) "
style = "onsurface"
symbol = "[▶](secondary italic)"

[localip]
ssh_only = true
format = " ◯[$localipv4](bold tertiary)"
disabled = false

[time]
disabled = false
format = "[ $time]($style)"
time_format = "%R"
utc_time_offset = "local"
style = "italic dimmed onsurface"

[battery]
format = "[ $percentage $symbol]($style)"
full_symbol = "█"
charging_symbol = "[↑](italic bold tertiary)"
discharging_symbol = "↓"
unknown_symbol = "░"
empty_symbol = "▃"

[[battery.display]]
threshold = 20
style = "italic bold error"

[[battery.display]]
threshold = 60
style = "italic dimmed tertiary"

[[battery.display]]
threshold = 70
style = "italic dimmed primary"

[git_branch]
format = " [$branch(:$remote_branch)]($style)"
symbol = "[△](bold italic secondary)"
style = "italic secondary"
truncation_symbol = "⋯"
truncation_length = 11
ignore_branches = ["main", "master"]
only_attached = true

[git_metrics]
format = '([▴$added]($added_style))([▿$deleted]($deleted_style))'
added_style = 'italic dimmed tertiary'
deleted_style = 'italic dimmed error'
ignore_submodules = true
disabled = false

[git_status]
style = "bold italic secondary"
format = "([⎪$ahead_behind$staged$modified$untracked$renamed$deleted$conflicted$stashed⎥]($style))"
conflicted = "[◪◦](italic tertiary)"
ahead = "[▴│[${count}](bold onsurface)│](italic tertiary)"
behind = "[▿│[${count}](bold onsurface)│](italic error)"
diverged = "[◇ ▴┤[${ahead_count}](regular onsurface)│▿┤[${behind_count}](regular onsurface)│](italic tertiary)"
untracked = "[◌◦](italic primary)"
stashed = "[◃◈](italic onsurface)"
modified = "[●◦](italic primary)"
staged = "[▪┤[$count](bold onsurface)│](italic secondary)"
renamed = "[◎◦](italic secondary)"
deleted = "[✕](italic error)"

[deno]
format = " [deno](italic) [∫ $version](tertiary bold)"
version_format = "${raw}"

[lua]
format = " [lua](italic) [${symbol}${version}]($style)"
version_format = "${raw}"
symbol = "⨀ "
style = "bold primary"

[nodejs]
format = " [node](italic) [◫ ($version)](bold tertiary)"
version_format = "${raw}"
detect_files = ["package-lock.json", "yarn.lock"]
detect_folders = ["node_modules"]
detect_extensions = []

[python]
format = " [py](italic) [${symbol}${version}]($style)"
symbol = "[⌉](bold secondary)⌊ "
version_format = "${raw}"
style = "bold primary"

[ruby]
format = " [rb](italic) [${symbol}${version}]($style)"
symbol = "◆ "
version_format = "${raw}"
style = "bold error"

[rust]
format = " [rs](italic) [$symbol$version]($style)"
symbol = "⊃ "
version_format = "${raw}"
style = "bold error"

[package]
format = " [pkg](italic dimmed) [$symbol$version]($style)"
version_format = "${raw}"
symbol = "◨ "
style = "dimmed primary italic bold"

[swift]
format = " [sw](italic) [${symbol}${version}]($style)"
symbol = "◁ "
style = "bold error"
version_format = "${raw}"

[aws]
disabled = true
format = " [aws](italic) [$symbol $profile $region]($style)"
style = "bold secondary"
symbol = "▲ "

[buf]
symbol = "■ "
format = " [buf](italic) [$symbol $version $buf_version]($style)"

[c]
symbol = "ℂ "
format = " [$symbol($version(-$name))]($style)"

[conda]
symbol = "◯ "
format = " conda [$symbol$environment]($style)"

[dart]
symbol = "◁◅ "
format = " dart [$symbol($version )]($style)"

[docker_context]
symbol = "◧ "
format = " docker [$symbol$context]($style)"

[elixir]
symbol = "△ "
format = " exs [$symbol $version OTP $otp_version ]($style)"

[elm]
symbol = "◩ "
format = " elm [$symbol($version )]($style)"

[golang]
symbol = "∩ "
format = " go [$symbol($version )]($style)"

[haskell]
symbol = "❯λ "
format = " hs [$symbol($version )]($style)"

[java]
symbol = "∪ "
format = " java [${symbol}(${version} )]($style)"

[julia]
symbol = "◎ "
format = " jl [$symbol($version )]($style)"

[memory_usage]
symbol = "▪▫▪ "
format = " mem [${ram}( ${swap})]($style)"

[nim]
symbol = "▴▲▴ "
format = " nim [$symbol($version )]($style)"

[nix_shell]
style = 'bold italic dimmed secondary'
symbol = '✶'
format = '[$symbol nix⎪$state⎪]($style) [$name](italic dimmed onsurface)'
impure_msg = '[⌽](bold dimmed error)'
pure_msg = '[⌾](bold dimmed tertiary)'
unknown_msg = '[◌](bold dimmed primary)'

[spack]
symbol = "◇ "
format = " spack [$symbol$environment]($style)"

[palettes.caelestia]
primary   = "#{{primary}}"
secondary = "#{{secondary}}"
tertiary  = "#{{tertiary}}"
error     = "#{{error}}"
onsurface = "#{{onSurface}}"
