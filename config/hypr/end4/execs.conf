# End-4 hybrid — execs (from execs.lua) — Caelestia wired
# Original hl.on("hyprland.start") → exec-once
# Shell: only Caelestia (no qs -c ii). If ~/.config/quickshell/ii/ exists, leave on disk but never exec.
exec-once = $HOME/.config/hypr/hyprland/scripts/start_geoclue_agent.sh
exec-once = caelestia shell -d
# Video wallpaper restore (if present, harmless if missing)
exec-once = $HOME/.config/hypr/custom/scripts/__restore_video_wallpaper.sh

# Core components
exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = hypridle
exec-once = dbus-update-activation-environment --all
exec-once = sleep 1 && dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# Clipboard history — Caelestia style (no qs ipc)
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Cursor — End-4 default, falls back if theme missing
exec-once = hyprctl setcursor Bibata-Modern-Classic 24
