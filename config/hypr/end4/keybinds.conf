# End-4 hybrid — keybinds (from illogical-impulse keybinds.lua, 359 lines)
# Translated hl.bind → Hyprland bind*. Rewrites launcher chords to Caelestia IPC.
# Preserved as user overrides: ~/.config/hypr/UserConfigs/UserKeybinds.conf sourced after this.
# Verification: grep -c "caelestia shell drawers toggle launcher" this file >=1

$mainMod = SUPER
$scriptsDir = $HOME/.config/hypr/scripts
$qsConfig = caelestia
$qsScripts = $HOME/.config/quickshell/$qsConfig/scripts
$hyprScripts = $HOME/.config/hypr/hyprland/scripts
$qsIpcCall = qs -c $qsConfig ipc call

# ── Shell (Caelestia — rewritten from End-4 search/quick shell) ──
# End-4 used SUPER+SUPER_L/SUPER_R for searchToggle; we point that to Caelestia launcher.
# Keep Super+Space as primary launcher chord (plan Step 5 rule).
unbind = SUPER, SPACE
bindd = SUPER, SPACE, Open caelestia launcher, exec, caelestia shell drawers toggle launcher
bindd = SUPER, SUPER_L, Open caelestia launcher, exec, caelestia shell drawers toggle launcher
bindd = SUPER, SUPER_R, Open caelestia launcher, exec, caelestia shell drawers toggle launcher
bindd = SUPER, Slash, Show keybinds cheatsheet, exec, caelestia keybinds
bindd = SUPER, mouse:272, Window: Move, movewindow
bindd = SUPER, mouse:273, Window: Resize, resizewindow

# Overview — End-4's overviewWorkspacesToggle → Caelestia overview drawer (gated on overview.enabled)
# Do not steal Super+Space; use Super+Tab as plan Step 8.
bindd = SUPER, Tab, Shell: Toggle overview, exec, sh -c 'caelestia shell overview toggle 2>/dev/null || hyprctl dispatch global quickshell:overviewWorkspacesToggle 2>/dev/null || true'
bindd = SUPER, V, Shell: Clipboard history, exec, sh -c 'caelestia shell drawers toggle launcher 2>/dev/null || cliphist list | fuzzel --match-mode fzf --dmenu | cliphist decode | wl-copy'
bindd = SUPER, period, Shell: Emoji picker, exec, sh -c 'qs -c $qsConfig ipc call overviewEmojiToggle 2>/dev/null || $hyprScripts/fuzzel-emoji.sh copy 2>/dev/null || fuzzel --dmenu <<< "😀 😁 😂 🤣"'

# Sidebar toggles (End-4: sidebarLeft/sidebarRight) → map to Caelestia sidebar/dashboard
bindd = SUPER, A, Shell: Toggle left sidebar, exec, sh -c 'qs -c $qsConfig ipc call sidebarLeftToggle 2>/dev/null || caelestia shell drawers toggle sidebar 2>/dev/null || true'
bindd = SUPER, B, Shell: Toggle left sidebar (alt), exec, sh -c 'qs -c $qsConfig ipc call sidebarLeftToggle 2>/dev/null || true'
bindd = SUPER, O, Shell: Toggle left sidebar (alt2), exec, sh -c 'qs -c $qsConfig ipc call sidebarLeftToggle 2>/dev/null || true'
bindd = SUPER, N, Shell: Toggle right sidebar, exec, caelestia shell drawers toggle sidebar
bindd = SUPER, K, Shell: Toggle on-screen keyboard, exec, sh -c 'qs -c $qsConfig ipc call oskToggle 2>/dev/null || true'
bindd = SUPER, M, Shell: Toggle media controls, exec, sh -c 'qs -c $qsConfig ipc call mediaControlsToggle 2>/dev/null || true'
bindd = SUPER, G, Shell: Toggle widget overlay, exec, sh -c 'qs -c $qsConfig ipc call overlayToggle 2>/dev/null || true'
bindd = CTRL ALT, Delete, Shell: Toggle session menu, exec, sh -c 'caelestia shell drawers toggle session 2>/dev/null || wlogout -p layer-shell 2>/dev/null || true'
bindd = SUPER, J, Shell: Toggle bar, exec, sh -c 'qs -c $qsConfig ipc call barToggle 2>/dev/null || true'

# ── Utilities ──
# Screenshot / Record / OCR / Color picker
bindd = SUPER SHIFT, S, Utilities: Screen snip, exec, sh -c 'qs -c $qsConfig ipc call regionScreenshot 2>/dev/null || hyprshot --freeze --clipboard-only --mode region --silent 2>/dev/null || grim -g "$(slurp)" - | wl-copy'
bindd = SUPER SHIFT, A, Utilities: Google Lens, exec, sh -c 'qs -c $qsConfig ipc call regionSearch 2>/dev/null || $hyprScripts/snip_to_search.sh 2>/dev/null || true'
bindd = SUPER SHIFT, X, Utilities: OCR, exec, sh -c 'qs -c $qsConfig ipc call regionOcr 2>/dev/null || grim -g "$(slurp)" "/tmp/ocr_image.png" && tesseract "/tmp/ocr_image.png" stdout -l eng | wl-copy && rm "/tmp/ocr_image.png"'
bindd = SUPER SHIFT, T, Utilities: Translate, exec, sh -c 'qs -c $qsConfig ipc call screenTranslate 2>/dev/null || true'
bindd = SUPER SHIFT, C, Utilities: Pick color, exec, hyprpicker -a

bindd = SUPER SHIFT, R, Utilities: Record region, exec, sh -c '$qsScripts/videos/record.sh 2>/dev/null || wf-recorder -g "$(slurp)" -f ~/Videos/record.mp4 2>/dev/null || true'
bindd = SUPER ALT, R, Utilities: Record region (alt), exec, sh -c '$qsScripts/videos/record.sh 2>/dev/null || true'
bindd = CTRL ALT, R, Utilities: Record fullscreen, exec, sh -c '$qsScripts/videos/record.sh --fullscreen 2>/dev/null || wf-recorder -f ~/Videos/record.mp4 2>/dev/null || true'
bindd = SUPER SHIFT ALT, R, Utilities: Record screen with sound, exec, sh -c '$qsScripts/videos/record.sh --fullscreen --sound 2>/dev/null || true'

bindd = , Print, Utilities: Screenshot >> clipboard, exec, grim -o "$(hyprctl activeworkspace -j | jq -r '.monitor')" - | wl-copy
bindd = CTRL, Print, Utilities: Screenshot >> file & clipboard, exec, sh -c 'mkdir -p $(xdg-user-dir PICTURES)/Screenshots && grim -o "$(hyprctl activeworkspace -j | jq -r ".monitor")" $(xdg-user-dir PICTURES)/Screenshots/Screenshot_$(date +%Y-%m-%d_%H.%M.%S).png && grim -o "$(hyprctl activeworkspace -j | jq -r ".monitor")" - | wl-copy'

# Brightness / Volume (locked, repeating)
bindle = , XF86MonBrightnessUp, Brightness up, exec, sh -c 'qs -c $qsConfig ipc call brightness increment 2>/dev/null || brightnessctl s 5%+'
bindle = , XF86MonBrightnessDown, Brightness down, exec, sh -c 'qs -c $qsConfig ipc call brightness decrement 2>/dev/null || brightnessctl s 5%-'
bindle = , XF86AudioRaiseVolume, Volume up, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%+ -l 1.5
bindle = , XF86AudioLowerVolume, Volume down, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%-

# Wallpaper / Theming
bindd = CTRL SUPER, T, Shell: Change wallpaper, exec, sh -c 'qs -c $qsConfig ipc call wallpaperSelectorToggle 2>/dev/null || caelestia wallpaper -r 2>/dev/null || $qsScripts/colors/switchwall.sh 2>/dev/null || true'
bindd = CTRL SUPER ALT, T, Shell: Random wallpaper, exec, sh -c 'qs -c $qsConfig ipc call wallpaperSelectorRandom 2>/dev/null || caelestia wallpaper -r 2>/dev/null || true'
bindd = CTRL SUPER SHIFT, D, Shell: Toggle light/dark, exec, sh -c 'qs -c $qsConfig ipc call toggleLightDark 2>/dev/null || ~/.config/hypr/scripts/toggle-scheme.sh 2>/dev/null || true'
bindd = CTRL SUPER, R, Shell: Restart widgets, exec, sh -c 'killall ydotool qs quickshell 2>/dev/null; qs -c $qsConfig &'

# ── Screen ──
# Zoom (End-4: zoomfunction via hl.config cursor:zoom_factor)
bindd = SUPER, minus, Screen: Zoom out, exec, hyprctl keyword cursor:zoom_factor "$(hyprctl getoption cursor:zoom_factor -j | jq -r '.float' | awk '{print ($1-0.3<1?1:$1-0.3)}')"
bindd = SUPER, equal, Screen: Zoom in, exec, hyprctl keyword cursor:zoom_factor "$(hyprctl getoption cursor:zoom_factor -j | jq -r '.float' | awk '{print ($1+0.3>3?3:$1+0.3)}')"

# ── Media ──
bindd = SUPER SHIFT, N, Media: Next track, exec, sh -c 'playerctl next || playerctl position `bc <<< "100 * $(playerctl metadata mpris:length) / 1000000 / 100"`'
bindd = , XF86AudioNext, Media: Next, exec, sh -c 'playerctl next || playerctl position `bc <<< "100 * $(playerctl metadata mpris:length) / 1000000 / 100"`'
bindd = , XF86AudioPrev, Media: Previous, exec, playerctl previous
bindd = SUPER SHIFT, B, Media: Previous track, exec, playerctl previous
bindd = SUPER SHIFT, P, Media: Play/pause, exec, playerctl play-pause
bindd = , XF86AudioPlay, Media: Play/pause, exec, playerctl play-pause
bindd = , XF86AudioPause, Media: Play/pause (alt), exec, playerctl play-pause
bindd = , XF86AudioMute, Media: Toggle mute, exec, wpctl set-mute @DEFAULT_SINK@ toggle
bindd = SUPER SHIFT, M, Media: Toggle mute, exec, wpctl set-mute @DEFAULT_SINK@ toggle
bindd = ALT, XF86AudioMute, Media: Toggle mic, exec, wpctl set-mute @DEFAULT_SOURCE@ toggle
bindd = , XF86AudioMicMute, Media: Toggle mic, exec, wpctl set-mute @DEFAULT_SOURCE@ toggle
bindd = SUPER ALT, M, Media: Toggle mic (alt), exec, wpctl set-mute @DEFAULT_SOURCE@ toggle

# ── Window ──
# Focusing
bindd = SUPER, left, Window: Focus left, movefocus, l
bindd = SUPER, right, Window: Focus right, movefocus, r
bindd = SUPER, up, Window: Focus up, movefocus, u
bindd = SUPER, down, Window: Focus down, movefocus, d
bindd = SUPER, bracketleft, Window: Focus left (alt), movefocus, l
bindd = SUPER, bracketright, Window: Focus right (alt), movefocus, r

# Move in direction
bindd = SUPER SHIFT, left, Window: Move left, movewindow, l
bindd = SUPER SHIFT, right, Window: Move right, movewindow, r
bindd = SUPER SHIFT, up, Window: Move up, movewindow, u
bindd = SUPER SHIFT, down, Window: Move down, movewindow, d

bindd = ALT, F4, Window: Close (hint), exec, notify-send "Wrong close keybind" "Super+Q to close. Use Alt+F4 for Windows VMs" -a Hyprland
bindd = SUPER, Q, Window: Close, killactive,
bindd = SUPER SHIFT ALT, Q, Window: Forcefully zap, exec, hyprctl kill

# Window split ratio
binde = SUPER, semicolon, Split ratio -0.1, splitratio, -0.1
binde = SUPER, apostrophe, Split ratio +0.1, splitratio, +0.1

# Float / Fullscreen / Pin
bindd = SUPER ALT, space, Window: Float/Tile, togglefloating,
bindd = SUPER, D, Window: Maximize, fullscreen, 1
bindd = SUPER, F, Window: Fullscreen, fullscreen, 0
bindd = SUPER ALT, F, Window: Fullscreen spoof, fullscreenstate, 0 3
bindd = SUPER, P, Window: Pin, pin,

# Send to workspace (SUPER+ALT+1..0)
bindd = SUPER ALT, 1, Window: Send to workspace 1, movetoworkspace, 1
bindd = SUPER ALT, 2, Window: Send to workspace 2, movetoworkspace, 2
bindd = SUPER ALT, 3, Window: Send to workspace 3, movetoworkspace, 3
bindd = SUPER ALT, 4, Window: Send to workspace 4, movetoworkspace, 4
bindd = SUPER ALT, 5, Window: Send to workspace 5, movetoworkspace, 5
bindd = SUPER ALT, 6, Window: Send to workspace 6, movetoworkspace, 6
bindd = SUPER ALT, 7, Window: Send to workspace 7, movetoworkspace, 7
bindd = SUPER ALT, 8, Window: Send to workspace 8, movetoworkspace, 8
bindd = SUPER ALT, 9, Window: Send to workspace 9, movetoworkspace, 9
bindd = SUPER ALT, 0, Window: Send to workspace 10, movetoworkspace, 10

bindd = SUPER SHIFT, Page_Up, Window: Send to workspace right, movetoworkspace, +1
bindd = SUPER SHIFT, Page_Down, Window: Send to workspace left, movetoworkspace, -1
bindd = SUPER ALT, S, Window: Send to scratchpad, movetoworkspace, special:special
bindd = CTRL SUPER, S, Workspace: Toggle scratchpad, togglespecialworkspace, special

# ── Workspace ──
bindd = SUPER, 1, Workspace: Focus 1, workspace, 1
bindd = SUPER, 2, Workspace: Focus 2, workspace, 2
bindd = SUPER, 3, Workspace: Focus 3, workspace, 3
bindd = SUPER, 4, Workspace: Focus 4, workspace, 4
bindd = SUPER, 5, Workspace: Focus 5, workspace, 5
bindd = SUPER, 6, Workspace: Focus 6, workspace, 6
bindd = SUPER, 7, Workspace: Focus 7, workspace, 7
bindd = SUPER, 8, Workspace: Focus 8, workspace, 8
bindd = SUPER, 9, Workspace: Focus 9, workspace, 9
bindd = SUPER, 0, Workspace: Focus 10, workspace, 10

bindd = CTRL SUPER, left, Workspace: Focus left, workspace, m-1
bindd = CTRL SUPER, right, Workspace: Focus right, workspace, m+1
bindd = SUPER, Page_Down, Workspace: Focus right, workspace, e+1
bindd = SUPER, Page_Up, Workspace: Focus left, workspace, e-1
bindd = SUPER, mouse_down, Workspace: Focus right, workspace, e+1
bindd = SUPER, mouse_up, Workspace: Focus left, workspace, e-1

bindd = SUPER, S, Workspace: Toggle scratchpad, togglespecialworkspace, special
bindd = SUPER, mouse:275, Workspace: Toggle scratchpad (mouse), togglespecialworkspace, special

# ── Session ──
bindd = SUPER, L, Session: Lock, exec, loginctl lock-session
bindd = SUPER SHIFT, L, Session: Sleep, exec, systemctl suspend || loginctl suspend
bindd = CTRL SHIFT ALT SUPER, Delete, Session: Shut down, exec, systemctl poweroff || loginctl poweroff

# ── Apps (End-4 launch_first_available.sh) ──
bindd = SUPER, Return, App: Terminal, exec, foot || kitty -1 || alacritty || wezterm
bindd = SUPER, T, App: Terminal (alt), exec, foot || kitty -1 || alacritty
bindd = CTRL ALT, T, App: Terminal (ctrl alt), exec, foot || kitty -1
bindd = SUPER, E, App: File manager, exec, thunar || dolphin || nautilus || kitty -1 fish -c yazi
bindd = SUPER, W, App: Browser, exec, firefox || google-chrome-stable || chromium || brave
bindd = SUPER, C, App: Code editor, exec, code || codium || cursor || kate
bindd = SUPER, X, App: Text editor, exec, kate || gnome-text-editor || emacs
bindd = CTRL SUPER, V, App: Volume mixer, exec, pavucontrol || pavucontrol-qt
bindd = SUPER, I, App: Settings app, exec, systemsettings || gnome-control-center
bindd = CTRL SHIFT, Escape, App: Task manager, exec, gnome-system-monitor || btop || kitty -1 btop

# ── AI (from End-4) ──
bindd = SUPER SHIFT ALT, mouse:273, Utilities: AI summary for selected text, exec, $hyprScripts/ai/primary-buffer-query.sh 2>/dev/null || true
