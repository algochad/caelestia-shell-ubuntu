# End-4 hybrid — rules (from hyprland/rules.lua)
# Translated hl.window_rule / hl.layer_rule / hl.workspace_rule → windowrule / layerrule / workspace

# ── Window rules ──
# Disable blur for xwayland context menus and all windows (End-4 defaults)
windowrule = noblur, match:class ^()$, match:title ^()$
windowrule = noblur, match:class .*

# Floating — dialogs
windowrule = float on, match:title ^(Open File)(.*)$
windowrule = center on, match:title ^(Open File)(.*)$
windowrule = float on, match:title ^(Select a File)(.*)$
windowrule = center on, match:title ^(Select a File)(.*)$
windowrule = float on, match:title ^(Choose wallpaper)(.*)$
windowrule = center on, match:title ^(Choose wallpaper)(.*)$
windowrule = size 60% 65%, match:title ^(Choose wallpaper)(.*)$
windowrule = float on, match:title ^(Open Folder)(.*)$
windowrule = center on, match:title ^(Open Folder)(.*)$
windowrule = float on, match:title ^(Save As)(.*)$
windowrule = center on, match:title ^(Save As)(.*)$
windowrule = float on, match:title ^(Library)(.*)$
windowrule = center on, match:title ^(Library)(.*)$
windowrule = float on, match:title ^(File Upload)(.*)$
windowrule = center on, match:title ^(File Upload)(.*)$
windowrule = float on, match:title ^(.*)(wants to save)$
windowrule = center on, match:title ^(.*)(wants to save)$
windowrule = float on, match:title ^(.*)(wants to open)$
windowrule = center on, match:title ^(.*)(wants to open)$

windowrule = float on, match:class ^(blueberry\.py)$
windowrule = float on, match:class ^(guifetch)$
windowrule = float on, match:class ^(pavucontrol)$
windowrule = size 45% 45%, match:class ^(pavucontrol)$
windowrule = center on, match:class ^(pavucontrol)$
windowrule = float on, match:class ^(org.pulseaudio.pavucontrol)$
windowrule = size 45% 45%, match:class ^(org.pulseaudio.pavucontrol)$
windowrule = center on, match:class ^(org.pulseaudio.pavucontrol)$
windowrule = float on, match:class ^(nm-connection-editor)$
windowrule = size 45% 45%, match:class ^(nm-connection-editor)$
windowrule = center on, match:class ^(nm-connection-editor)$
windowrule = float on, match:class .*plasmawindowed.*
windowrule = float on, match:class kcm_.*
windowrule = float on, match:class .*bluedevilwizard
windowrule = float on, match:title .*Welcome
windowrule = float on, match:title ^(illogical-impulse Settings)$
windowrule = float on, match:title .*Shell conflicts.*
windowrule = float on, match:class org.freedesktop.impl.portal.desktop.kde
windowrule = size 60% 65%, match:class org.freedesktop.impl.portal.desktop.kde
windowrule = float on, match:class ^(Zotero)$
windowrule = size 45% 45%, match:class ^(Zotero)$

# Move — kde-material-you-colors
windowrule = float on, match:class ^(plasma-changeicons)$
windowrule = noinitialfocus on, match:class ^(plasma-changeicons)$
windowrule = move 999999 999999, match:class ^(plasma-changeicons)$
windowrule = move 40 80, match:title ^(Copying — Dolphin)$

# Tiling
windowrule = tile on, match:class ^dev\.warp\.Warp$

# Picture-in-Picture
windowrule = float on, match:title ^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$
windowrule = keepaspectratio on, match:title ^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$
windowrule = move 73% 72%, match:title ^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$
windowrule = size 25% 25%, match:title ^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$
windowrule = pin on, match:title ^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$

# Screen sharing
windowrule = float on, match:title .*is sharing (a window|your screen).*
windowrule = pin on, match:title .*is sharing (a window|your screen).*
windowrule = move 50%-windoww/2 windowh-12, match:title .*is sharing (a window|your screen).*

# Tearing
windowrule = immediate on, match:title .*\.exe
windowrule = immediate on, match:title .*minecraft.*
windowrule = immediate on, match:class ^(steam_app).*

# No shadow for tiled windows
windowrule = noshadow on, match:float 0

# ── Workspace rules ──
workspace = special:special, gapsout:30

# ── Layer rules ──
layerrule = xray on, match:namespace .*
layerrule = noanim on, match:namespace walker
layerrule = noanim on, match:namespace selection
layerrule = noanim on, match:namespace overview
layerrule = noanim on, match:namespace anyrun
layerrule = noanim on, match:namespace indicator.*
layerrule = noanim on, match:namespace osk
layerrule = noanim on, match:namespace hyprpicker
layerrule = noanim on, match:namespace noanim
layerrule = blur on, match:namespace gtk-layer-shell
layerrule = ignorealpha 0, match:namespace gtk-layer-shell
layerrule = blur on, match:namespace launcher
layerrule = ignorealpha 0.5, match:namespace launcher
layerrule = blur on, match:namespace notifications
layerrule = ignorealpha 0.69, match:namespace notifications
layerrule = blur on, match:namespace logout_dialog

# quickshell (illogical-impulse)
layerrule = blurpopups on, match:namespace quickshell:.*
layerrule = blur on, match:namespace quickshell:.*
layerrule = ignorealpha 0.79, match:namespace quickshell:.*
layerrule = animation slide, match:namespace quickshell:bar
layerrule = noanim on, match:namespace quickshell:actionCenter
layerrule = animation slide bottom, match:namespace quickshell:cheatsheet
layerrule = animation slide bottom, match:namespace quickshell:dock
layerrule = animation popin 120%, match:namespace quickshell:screenCorners
layerrule = noanim on, match:namespace quickshell:lockWindowPusher
layerrule = animation fade, match:namespace quickshell:notificationPopup
layerrule = noanim on, match:namespace quickshell:overlay
layerrule = ignorealpha 1, match:namespace quickshell:overlay
layerrule = noanim on, match:namespace quickshell:overview
layerrule = animation slide bottom, match:namespace quickshell:osk
layerrule = noanim on, match:namespace quickshell:polkit
layerrule = xray off, match:namespace quickshell:popup
layerrule = ignorealpha 1, match:namespace quickshell:popup
layerrule = ignorealpha 1, match:namespace quickshell:mediaControls
layerrule = animation slide, match:namespace quickshell:reloadPopup
layerrule = noanim on, match:namespace quickshell:regionSelector
layerrule = noanim on, match:namespace quickshell:screenshot
layerrule = blur on, match:namespace quickshell:session
layerrule = noanim on, match:namespace quickshell:session
layerrule = ignorealpha 0, match:namespace quickshell:session
layerrule = animation slide right, match:namespace quickshell:sidebarRight
layerrule = animation slide left, match:namespace quickshell:sidebarLeft
layerrule = animation slide, match:namespace quickshell:verticalBar
layerrule = order -1, match:namespace quickshell:osk
layerrule = animation slide top, match:namespace quickshell:wallpaperSelector
layerrule = noanim on, match:namespace quickshell:wNotificationCenter
layerrule = noanim on, match:namespace quickshell:wOnScreenDisplay
layerrule = noanim on, match:namespace quickshell:wStartMenu
layerrule = ignorealpha 0, match:namespace quickshell:wTaskView
layerrule = noanim on, match:namespace quickshell:wTaskView
layerrule = noanim on, match:namespace gtk4-layer-shell

# Caelestia shell layer rules (retain Caelestia's own blur — do not conflict)
layerrule = blur on, match:namespace caelestia.*
layerrule = ignorealpha 0.79, match:namespace caelestia.*
